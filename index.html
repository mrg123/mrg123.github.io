<style>
  :root {
    --bg: #f7f5f0;
    --ink: #1c1a16;
    --muted: #85817a;
    --faint: #b3aea4;
    --line: #e7e2d8;
    --gold: #a8790e;
    --gold-soft: rgba(168, 121, 14, 0.3);
    --serif: 'Playfair Display', 'Noto Serif SC', 'Songti SC', Georgia, serif;
    --body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

  /* ---------- 顶栏 ---------- */
  header.topbar { padding: 26px 0 22px; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 700; letter-spacing: 4px;
  }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft);
  }

  /* ---------- 海报网格 ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px; padding-bottom: 26px;
  }
  .card {
    position: relative; display: block;
    aspect-ratio: 4 / 5;
    border-radius: var(--radius); overflow: hidden;
    text-decoration: none; color: var(--ink);
    border: 1px solid var(--line);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -20px rgba(28, 26, 22, .25); }
  .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .poster {
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }
  .p-head {
    position: absolute; top: 11px; left: 13px; right: 13px; z-index: 1;
    display: flex; align-items: baseline; gap: 7px; min-width: 0;
  }
  .p-num {
    font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 15px;
    color: var(--gold); flex: none;
  }
  .p-name {
    font-family: var(--serif); font-size: 14.5px; font-weight: 700; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .p-emoji {
    font-size: 44px; z-index: 1;
    filter: drop-shadow(0 6px 14px rgba(28, 26, 22, .18));
    transition: transform .35s ease;
  }
  .card:hover .p-emoji { transform: scale(1.1) rotate(-3deg); }
  .p-desc {
    position: absolute; left: 13px; right: 13px; bottom: 10px; z-index: 1;
    font-size: 11.5px; line-height: 1.55; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .p-arrow {
    position: absolute; top: 10px; right: 13px; z-index: 1;
    color: var(--gold); font-size: 14px;
    opacity: 0; transform: translateX(-6px);
    transition: transform .3s ease, opacity .3s ease;
  }
  .card:hover .p-arrow { opacity: 1; transform: translateX(0); }

  .card.ghost { border: 1px dashed #d4cec2; cursor: default; }
  .card.ghost:hover { transform: none; box-shadow: none; }
  .card.ghost .plus {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--serif); font-size: 34px; font-weight: 400; color: var(--faint);
  }

  /* ---------- 底部 ---------- */
  footer.site { padding: 22px 0 52px; }
  footer.site a { color: var(--faint); font-size: 13px; text-decoration: none; letter-spacing: 2px; transition: color .25s ease; }
  footer.site a:hover { color: var(--gold); }

  /* ---------- 响应式 ---------- */
  @media (max-width: 560px) {
    header.topbar { padding: 20px 0 16px; }
    .grid { gap: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
    .card, .card:hover { transform: none !important; }
  }
</style>
</head>

    <div class="card ghost">

    </div>

  </main>

  <footer class="site">
