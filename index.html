<style>
  :root {
    --bg: #0a0a14;
    --bg-2: #0e0e1c;
    --panel: rgba(20, 20, 34, 0.6);
    --panel-border: rgba(255, 255, 255, 0.08);
    --ink: #e8e8f2;
    --muted: #8b8ba3;
    --faint: #6d6d88;
    --cyan: #22d3ee;
    --violet: #c084fc;
    --magenta: #ff2ec4;
    --radius: 18px;
    --font-display: 'Orbitron', ui-monospace, 'SF Mono', 'Menlo', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景层 ---------- */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .grid-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
    background-image:
      linear-gradient(rgba(120,130,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,130,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
  }
  .blob {
    position: fixed; z-index: 0; border-radius: 50%;
    filter: blur(120px); opacity: 0.35; pointer-events: none;
  }
  .blob.b1 { width: 520px; height: 520px; background: #4b2bc9; top: -160px; left: -120px; }
  .blob.b2 { width: 460px; height: 460px; background: #0e6ba8; top: 10%; right: -140px; opacity: 0.28; }
  .blob.b3 { width: 380px; height: 380px; background: #7a1e6b; bottom: -120px; left: 30%; opacity: 0.22; }

  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---------- 顶栏 ---------- */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0; font-family: var(--font-display);
  }
  .brand { display: flex; align-items: center; gap: 12px; letter-spacing: 3px; font-weight: 900; font-size: 15px; }
  .brand .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .brand .dot.alt { background: var(--magenta); box-shadow: 0 0 12px var(--magenta); animation-delay: 1.2s; }
  .brand em { font-style: normal; color: var(--muted); font-weight: 500; }
  .clock { font-weight: 500; font-size: 14px; color: var(--muted); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  /* ---------- Hero ---------- */
  .hero { padding: 72px 0 40px; text-align: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-size: 12px; letter-spacing: 5px;
    color: var(--cyan); text-transform: uppercase; margin-bottom: 22px;
  }
  .eyebrow::before, .eyebrow::after { content: ''; width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan)); }
  .eyebrow::after { transform: scaleX(-1); }

  h1.title {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(44px, 9vw, 92px); line-height: 1.02;
    letter-spacing: 2px;
    background: linear-gradient(100deg, #fff 0%, #cfe9ff 30%, var(--cyan) 55%, var(--violet) 80%, var(--magenta) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.25));
    position: relative;
  }
  .title .glitch {
    position: relative; display: inline-block; -webkit-text-fill-color: transparent;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; inset: 0;
    background: inherit; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .glitch::before { color: #0ff; animation: glitchA 3s infinite steps(1); }
  .glitch::after { color: #f0f; animation: glitchB 3s infinite steps(1); }
  @keyframes glitchA {
    0%, 86%, 100% { transform: translate(0); opacity: 0 }
    87% { transform: translate(-3px, 2px); opacity: .8 }
    90% { transform: translate(2px, -1px); opacity: .8 }
    93% { transform: translate(-2px, 0); opacity: .6 }
  }
  @keyframes glitchB {
    0%, 86%, 100% { transform: translate(0); opacity: 0 }
    88% { transform: translate(3px, -2px); opacity: .7 }
    91% { transform: translate(-2px, 1px); opacity: .7 }
    94% { transform: translate(2px, 0); opacity: .5 }
  }

  .subtitle {
    margin: 26px auto 0; max-width: 560px; font-size: 17px; color: var(--muted);
  }
  .subtitle b { color: var(--ink); font-weight: 600; }

  .stats {
    display: flex; gap: 14px; justify-content: center; margin-top: 34px; flex-wrap: wrap;
  }
  .stat {
    font-family: var(--font-display); font-size: 12px; letter-spacing: 1.5px;
    color: var(--muted); padding: 9px 18px; border-radius: 999px;
    border: 1px solid var(--panel-border); background: var(--panel);
    backdrop-filter: blur(8px);
  }
  .stat b { color: var(--cyan); font-weight: 700; }

  /* ---------- 筛选 ---------- */
  .filters {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 48px 0 30px;
  }
  .filter-btn {
    font-family: var(--font-body); font-size: 14px; color: var(--muted);
    background: transparent; border: 1px solid var(--panel-border);
    padding: 9px 20px; border-radius: 999px; cursor: pointer;
    transition: all .25s ease; min-height: 44px;
  }
  .filter-btn:hover { color: var(--ink); border-color: var(--cyan); }
  .filter-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .filter-btn.active {
    color: #041018; background: var(--cyan); border-color: var(--cyan);
    font-weight: 600; box-shadow: 0 0 20px rgba(34,211,238,0.4);
  }

  /* ---------- 项目卡片 ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px; padding-bottom: 30px;
  }
  .card {
    --accent: #22d3ee;
    position: relative; display: flex; flex-direction: column; gap: 14px;
    padding: 26px 24px 22px; border-radius: var(--radius);
    background: linear-gradient(160deg, rgba(28,28,46,0.75), rgba(14,14,24,0.85));
    border: 1px solid var(--panel-border);
    text-decoration: none; color: var(--ink);
    overflow: hidden; transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    will-change: transform;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%),
      color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%);
    opacity: 0; transition: opacity .35s ease; pointer-events: none;
  }
  .card::after {
    content: ''; position: absolute; left: 0; top: 0; height: 2px; width: 100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0; transition: opacity .3s ease;
  }
  .card:hover { transform: translateY(-6px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 18px 50px -20px color-mix(in srgb, var(--accent) 45%, transparent); }
  .card:hover::before { opacity: 1; }
  .card:hover::after { opacity: 1; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-icon {
    width: 58px; height: 58px; border-radius: 15px; display: grid; place-items: center;
    font-size: 30px; background: color-mix(in srgb, var(--accent) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    box-shadow: inset 0 0 18px color-mix(in srgb, var(--accent) 12%, transparent);
    transition: transform .3s ease;
  }
  .card:hover .card-icon { transform: scale(1.08) rotate(-4deg); }
  .card-tag {
    font-family: var(--font-display); font-size: 10px; letter-spacing: 2px;
    color: var(--accent); padding: 5px 12px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    white-space: nowrap;
  }
  .card-title { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  .card-en { display: block; font-family: var(--font-display); font-size: 11px; letter-spacing: 3px; color: var(--muted); font-weight: 500; margin-top: 3px; text-transform: uppercase; }
  .card-desc { font-size: 14px; color: var(--muted); line-height: 1.7; flex: 1; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .card-cta {
    font-family: var(--font-display); font-size: 12px; letter-spacing: 2px; color: var(--accent);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .card-cta .arrow { transition: transform .3s ease; }
  .card:hover .card-cta .arrow { transform: translateX(5px); }
  .card-keys { font-size: 11px; color: var(--faint); font-family: var(--font-display); letter-spacing: 1px; }

  /* 占位卡（敬请期待） */
  .card.ghost {
    align-items: center; justify-content: center; text-align: center;
    border: 1px dashed rgba(255,255,255,0.12); background: transparent; min-height: 240px;
    color: var(--faint); cursor: default;
  }
  .card.ghost:hover { transform: none; border-color: rgba(255,255,255,0.2); box-shadow: none; }
  .card.ghost .plus { font-family: var(--font-display); font-size: 44px; font-weight: 300; line-height: 1; }
  .card.ghost p { font-size: 13px; letter-spacing: 1px; }

  /* ---------- 底部 ---------- */
  footer.site {
    margin-top: 50px; padding: 40px 0 60px; text-align: center;
    border-top: 1px solid var(--panel-border);
  }
  footer.site a { color: var(--cyan); text-decoration: none; }
  footer.site a:hover { text-decoration: underline; }
  .footer-note { color: var(--faint); font-size: 13px; margin-top: 10px; }

  @media (max-width: 640px) {
    .hero { padding: 56px 0 28px; }
    .grid { grid-template-columns: 1fr; }
    .clock { display: none; }
    header.topbar { justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; scroll-behavior: auto !important; }
    .card, .card:hover { transform: none !important; }
  }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="grid-layer" aria-hidden="true"></div>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>

<div class="wrap">

  <header class="topbar">
    <div class="brand"><span class="dot"></span><span class="dot alt"></span> MRG <em>· PLAYGROUND</em></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <section class="hero">
    <div class="eyebrow">Web Games &amp; Design</div>
    <h1 class="title" aria-label="我的游乐场"><span class="glitch" data-text="我的游乐场">我的游乐场</span></h1>
    <p class="subtitle">一个 <b>网页项目合集</b> —— 3D 迷宫、赛博跑酷、手绘猫咪、绘画应用与网站导航，<br>点开卡片，即可开始体验。</p>

    <div class="stats">
      <span class="stat"><b id="count">0</b> 个项目</span>
      <span class="stat">持续更新中</span>
      <span class="stat">无需下载 · 浏览器即玩</span>
    </div>
  </section>

  <nav class="filters" id="filters" aria-label="项目筛选">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="游戏">🎮 游戏</button>
    <button class="filter-btn" data-filter="创意">🎨 创意</button>
    <button class="filter-btn" data-filter="应用">📱 应用</button>
    <button class="filter-btn" data-filter="工具">🧭 工具</button>
  </nav>

  <main class="grid" id="grid"></main>

  <footer class="site">
    <p>源码托管于 <a href="https://github.com/mrg123/mrg123.github.io" target="_blank" rel="noopener">GitHub</a> · 由 GitHub Pages 驱动</p>
    <p class="footer-note">更多有意思的网页设计与小游戏正在路上，敬请期待 ✦</p>
  </footer>
</div>

<script>
/* ============ 项目数据（新增项目只需在这里加一条） ============ */
const PROJECTS = [
  {
    name: '冒险的女孩', en: 'Adventure Girl',
    desc: '3D 暗夜迷宫冒险游戏，100 关层层推进，WASD 移动、拖拽旋转视角。',
    href: '/adventure-girl/', tags: ['游戏'], accent: '#c084fc', icon: '🌺', keys: 'WASD'
  },
  {
    name: '赛博雪橇 2077', en: 'Cyber Sleigh 2077',
    desc: '赛博朋克风跑酷游戏，收集绿色礼物、躲避红色防火墙，挑战最高分。',
    href: '/cyber-sleigh-2077/', tags: ['游戏'], accent: '#39ff14', icon: '🛷', keys: 'SPACE'
  },
  {
    name: '雪糕猫', en: 'Xuegao Cat',
    desc: '手绘马卡龙风猫咪生成器，输入任意名字，就能生成一只独一无二的小猫。',
    href: '/xuegao-cat/', tags: ['创意'], accent: '#f2a8c0', icon: '🐱', keys: ''
  },
  {
    name: 'Draw Now 绘画', en: 'Draw Now',
    desc: '极简治愈绘画应用官方落地页，随时随地把灵感画下来，还可下载 App。',
    href: '/draw-now/', tags: ['应用'], accent: '#3a86ff', icon: '🎨', keys: ''
  },
  {
    name: 'MediaNav 导航', en: 'MediaNav',
    desc: '个人网站导航系统，收藏整理新闻媒体、学习资源与财经资讯，一键直达。',
    href: '/nav/', tags: ['工具'], accent: '#22d3ee', icon: '🧭', keys: ''
  }
];

/* ============ 渲染卡片 ============ */
const grid = document.getElementById('grid');

function render(list) {
  grid.innerHTML = '';
  list.forEach(p => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = p.href;
    a.style.setProperty('--accent', p.accent);
    a.setAttribute('aria-label', p.name + ' — ' + p.en);
    a.innerHTML = `
      <div class="card-top">
        <div class="card-icon">${p.icon}</div>
        <span class="card-tag">${p.tags[0]}</span>
      </div>
      <h3 class="card-title">${p.name}<span class="card-en">${p.en}</span></h3>
      <p class="card-desc">${p.desc}</p>
      <div class="card-foot">
        <span class="card-cta">启动 <span class="arrow">→</span></span>
        ${p.keys ? `<span class="card-keys">${p.keys}</span>` : ''}
      </div>`;
    a.addEventListener('mousemove', e => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const r = a.getBoundingClientRect();
      a.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      a.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
    grid.appendChild(a);
  });

  // 敬请期待占位卡
  const ghost = document.createElement('div');
  ghost.className = 'card ghost';
  ghost.innerHTML = `<span class="plus">+</span><p>更多项目 · 开发中</p>`;
  grid.appendChild(ghost);

  document.getElementById('count').textContent = PROJECTS.length;
}

/* ============ 筛选 ============ */
const filterBtns = document.querySelectorAll('.filter-btn');
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
    const f = btn.dataset.filter;
    render(f === 'all' ? PROJECTS : PROJECTS.filter(p => p.tags.includes(f)));
  });
});

/* ============ 实时时钟 ============ */
const clockEl = document.getElementById('clock');
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}  ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
tick(); setInterval(tick, 1000);

/* ============ 星空背景 ============ */
(function starfield() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [], raf, running = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    c.width = window.innerWidth * (window.devicePixelRatio || 1);
    c.height = window.innerHeight * (window.devicePixelRatio || 1);
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    const w = window.innerWidth, h = window.innerHeight;
    const n = Math.min(160, Math.floor(w * h / 9000));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random() * 0.7 + 0.2,
      tw: Math.random() * Math.PI * 2,
      vy: Math.random() * 0.12 + 0.02,
      hue: Math.random() < 0.8 ? 200 : (Math.random() < 0.5 ? 280 : 320)
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (const s of stars) {
      if (!reduce) {
        s.y += s.vy;
        s.tw += 0.02;
        if (s.y > window.innerHeight + 2) { s.y = -2; s.x = Math.random() * window.innerWidth; }
      }
      const alpha = reduce ? s.a : s.a * (0.55 + 0.45 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue}, 80%, 80%, ${alpha})`;
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  resize();
  draw();
  window.addEventListener('resize', resize);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !reduce) { cancelAnimationFrame(raf); running = false; }
    else if (!running && !reduce) { running = true; draw(); }
  });
})();

render(PROJECTS);
</script>
</body>
</html>
